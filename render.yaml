services:
  - type: web
    name: skill-dashboard-api
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: AI_MODEL
        value: ZhipuAI/GLM-4.5
